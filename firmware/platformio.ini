; Solar Generator firmware. Two boards share src/common:
;   brain   = Lonely Binary ESP32-S3 N16R8 in the controller case (wiring + Bluetooth to the phone)
;   display = ELECROW CrowPanel Advanced 4.3 in (ESP32-S3) on the outside wall (ESP-NOW from the brain)
;   native  = host-side unit tests of src/common (no Arduino)
[platformio]
default_envs = brain, display

[esp32s3_base]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -Isrc/common -Isrc/esp

[env:brain]
extends = esp32s3_base
build_src_filter = +<common/> +<esp/> +<brain/>
lib_deps = h2zero/NimBLE-Arduino@1.4.2

[env:display]
extends = esp32s3_base
build_src_filter = +<common/> +<esp/> +<display/>
; Serial goes out the board's own USB port (UART bridge), not native USB: check on the real board in slice 2
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=0 -Isrc/common -Isrc/esp -Isrc/display -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  lvgl/lvgl@8.3.11
  lovyan03/LovyanGFX@1.2.0

[env:native]
platform = native
build_src_filter = +<common/>
build_flags = -std=gnu++17 -Isrc/common
test_build_src = yes
